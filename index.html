<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Notes</title>
  <meta name="description" content="Personal technical blog focused on modern computing architecture, elegant systems, and clean code.">
  <!--
    分享 / SEO 元信息。本站为 Hash 路由 SPA（每条路由共享同一个物理 URL），
    因此 canonical 与 og:url 一律指向站点根；配置了 blog.config.js 的 site.url 后，
    app.js#setDocumentTitle 会把它改写成绝对地址。

    两条约定：
    1) 下面三处 description 必须与 blog.config.js 的 site.description 逐字一致。
       js/components/navbar.js 启动时会把 <meta name="description"> 覆盖成配置值，
       两边文本不同的话，同一个标签在 hydration 前后是两个值（爬虫与读者看到的不一致）。
    2) lang 声明的是「页面主要语言」。本页外壳 —— 导航、标题、页脚、加载与错误态 ——
       全部是英文，因此声明 en；中文正文属于文章内容，不改变外壳的语言。
       若希望整站按中文声明，改这一处即可（并把上面的 description 换成中文）。
  -->
  <link rel="canonical" id="canonical-link" href="./">
  <meta name="theme-color" content="#0A0A0B">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Aurora Notes">
  <meta property="og:title" content="Aurora Notes">
  <meta property="og:description" content="Personal technical blog focused on modern computing architecture, elegant systems, and clean code.">
  <meta property="og:url" content="./">
  <!--
    og:image 由 `npm run build:og` 生成（scripts/generate-og-image.js，文案取自 blog.config.js）。
    这里写相对地址作静态兜底，app.js#setDocumentTitle 启动后会改写成绝对地址。
  -->
  <meta property="og:image" content="./og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Aurora Notes">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Aurora Notes">
  <meta name="twitter:description" content="Personal technical blog focused on modern computing architecture, elegant systems, and clean code.">
  <meta name="twitter:image" content="./og-image.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0B'/%3E%3Cpath d='M39 10 22 54' stroke='%233B82F6' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">

  <!--
    反白屏 (anti-FOUC)：外部 CSS 到达前先铺好底色。
    本站为固定深色主题，若不提前上色，浏览器默认白底会闪一下再变黑。
  -->
  <style>
    html, body { margin: 0; background: #0A0A0B; color: #EDEDED; }
  </style>

  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">

  <!-- Static utilities compiled at build time (no browser Tailwind runtime). -->
  <link rel="stylesheet" href="css/utilities.css">

  <!-- Custom Linear/Vercel Dark CSS -->
  <link rel="stylesheet" href="css/main.css">

  <!-- Vendor JS -->
  <script defer src="vendor/marked.min.js"></script>
  <script defer src="vendor/purify.min.js"></script>
  <script defer src="vendor/prism.js"></script>
  <script defer src="vendor/prism-components/prism-javascript.min.js"></script>
  <script defer src="vendor/prism-components/prism-python.min.js"></script>
  <script defer src="vendor/prism-components/prism-bash.min.js"></script>
  <script defer src="vendor/prism-components/prism-typescript.min.js"></script>
  <script defer src="vendor/katex/katex.min.js"></script>
</head>
<body class="bg-page text-primary min-h-screen flex flex-col antialiased selection:bg-accent/20 selection:text-primary">

  <!-- Ultra-subtle background grid (<3% opacity) -->
  <div class="fixed inset-0 pointer-events-none subtle-grid-bg z-0 opacity-40"></div>

  <!-- Top Reading Progress Indicator -->
  <div id="reading-progress-container" class="fixed top-0 left-0 w-full h-[2px] bg-transparent z-50 hidden">
    <div id="reading-progress-bar" class="h-full bg-accent w-0 transition-all duration-75"></div>
  </div>

  <!-- 1. Fixed Header (56px, blur(12px), Full Width Page Spanning, Zoom & Scaling Resistant) -->
  <header class="sticky top-0 z-40 w-full nav-blur">
    <div class="w-full px-4 sm:px-6 md:px-8 lg:px-12 h-14 flex items-center justify-between gap-4">
      
      <!-- Left side: Logo + Desktop Nav Group -->
      <div class="flex items-center gap-6 lg:gap-8 min-w-0">
        <!-- Logo: Monospace, font-weight 600 -->
        <a id="brand-link" href="#/" class="flex items-center gap-2 group text-primary font-mono text-[14px] font-semibold tracking-tight shrink-0 whitespace-nowrap">
          <span class="text-accent font-mono">/</span>
          <span>aurora.notes</span>
        </a>

        <!-- Desktop Nav: 由 blog.config.js 的 nav 配置驱动渲染，支持数组折叠为下拉菜单。
             注意：此容器不可使用 overflow-*，否则会裁掉绝对定位的下拉面板。 -->
        <nav id="desktop-nav" aria-label="Primary navigation" class="hidden md:flex items-center gap-4 lg:gap-6 whitespace-nowrap py-1"></nav>
      </div>

      <!-- Quick Actions (Search Cmd+K, Mobile menu hamburger) -->
      <div class="flex items-center gap-3 shrink-0">
        <button id="search-action" type="button" onclick="window.BlogApp.openSearchModal()" class="flex items-center gap-2 px-2.5 py-1 rounded-[6px] bg-surface hover:bg-white/[0.04] text-secondary hover:text-primary text-[12px] border border-subtle transition-all shrink-0 cursor-pointer" title="Search articles" aria-haspopup="dialog" aria-controls="search-modal">
          <svg class="w-3.5 h-3.5 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span class="hidden md:inline font-mono">Search</span>
          <kbd class="hidden md:inline-block px-1 py-0.2 text-[10px] font-mono bg-codebg border border-subtle rounded text-muted">⌘K</kbd>
        </button>

        <!-- Mobile menu hamburger -->
        <button id="mobile-nav-toggle" type="button" onclick="window.BlogApp.toggleMobileDrawer()" class="md:hidden p-1.5 rounded-md text-secondary hover:text-primary hover:bg-white/[0.06] shrink-0" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mobile-drawer">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Drawer (Full width backdrop) -->
    <nav id="mobile-drawer" aria-label="Mobile navigation" class="hidden md:hidden px-4 sm:px-6 md:px-8 py-3 space-y-2 border-t border-divider bg-page/95 backdrop-blur-md w-full"></nav>
  </header>

  <!-- 2. Main Content Container (Max width 720px, Centered, Ample breathing room) -->
  <main id="app-main" class="flex-grow w-full relative z-10">
    <!-- Views injected by BlogApp -->
  </main>

  <!-- 3. Minimalist Footer (Clean & quiet, contact info only in About) -->
  <footer class="mt-24 border-t border-divider py-10 relative z-10">
    <div class="shell mx-auto px-4 sm:px-6 flex items-center justify-between text-[12px] text-muted font-mono">
      <div id="footer-copyright">
        <!-- 无 JS 时的静态兜底；启动后由 js/components/footer.js 用 blog.config.js 的
             site.footerText 覆盖，两处必须一致。 -->
        © 2026 CCC · All rights reserved.
      </div>
    </div>
  </footer>

  <!-- Search Modal (Cmd+K) -->
  <div id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title" class="fixed inset-0 z-50 flex items-start justify-center pt-24 px-4 bg-page/80 backdrop-blur-sm hidden" onclick="if(event.target === this) window.BlogApp.closeSearchModal()">
    <div class="w-full max-w-[560px] bg-surface rounded-xl border border-white/[0.12] shadow-2xl overflow-hidden">
      <h2 id="search-modal-title" class="sr-only">Search articles</h2>
      <div class="p-3.5 border-b border-divider flex items-center gap-3">
        <svg class="w-4 h-4 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="search-modal-input" type="search" aria-label="Search articles" oninput="window.BlogApp.runModalSearchDebounced(this.value)" placeholder="Search articles, tags, concepts..." class="w-full text-[14px] bg-transparent focus:outline-none text-primary placeholder-muted">
        <button type="button" onclick="window.BlogApp.closeSearchModal()" class="text-[11px] font-mono text-muted hover:text-primary px-1.5 py-0.5 rounded bg-white/[0.04]">ESC</button>
      </div>
      <div id="search-modal-results" aria-live="polite" class="max-h-80 overflow-y-auto p-2 space-y-1">
        <!-- Results -->
      </div>
    </div>
  </div>

  <!-- Scripts
       应用脚本统一 defer：不阻塞首屏解析，且在 DOMContentLoaded 之前按文档顺序执行完毕。
       样式在构建时生成，vendor 与应用脚本依次 defer 加载。
       PDF.js（约 1.3MB）与 slide-viewer 体积较大，改为按需懒加载（见 app.js#ensureSlideViewer）。 -->
  <script defer src="js/icons.js"></script>
  <!-- 路由声明表必须早于 blog.config.js：后者的 routes / nav 由它派生。 -->
  <script defer src="js/lib/routes.js"></script>
  <script defer src="blog.config.js"></script>
  <script defer src="js/posts-data.js"></script>
  <script defer src="js/lib/html.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/markdown.js"></script>
  <script defer src="js/components/search-modal.js"></script>
  <script defer src="js/lib/scroll-state.js"></script>
  <script defer src="js/lib/router.js"></script>
  <script defer src="js/components/navbar.js"></script>
  <script defer src="js/components/footer.js"></script>
  <script defer src="js/components/publications.js"></script>
  <script defer src="js/components/post-item.js"></script>
  <script defer src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var main = document.getElementById('app-main');
      try {
        if (!window.BlogApp) throw new Error('Application script could not load.');
        window.BlogApp.init();
      } catch (error) {
        main.textContent = 'Unable to start Aurora Notes. Please refresh or rebuild the site.';
        main.setAttribute('role', 'alert');
        console.error(error);
      }
    }, { once: true });
  </script>
</body>
</html>
