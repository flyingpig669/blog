<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Notes</title>
  <meta name="description" content="全栈架构、量子前沿计算、统计物理与深度自注意力同构。冷静、克制、严谨。">

  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">

  <!-- Custom Linear/Vercel Dark CSS -->
  <link rel="stylesheet" href="css/main.css">

  <!-- Vendor JS -->
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            page: "#0A0A0B",
            surface: "#111113",
            codebg: "#161618",
            primary: "#EDEDED",
            secondary: "#8B8B8E",
            muted: "#5A5A5E",
            accent: "#3B82F6",
            cyanAccent: "#22D3EE"
          }
        }
      }
    };
  </script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/prism.js"></script>
  <script src="vendor/prism-components/prism-javascript.min.js"></script>
  <script src="vendor/prism-components/prism-python.min.js"></script>
  <script src="vendor/prism-components/prism-bash.min.js"></script>
  <script src="vendor/prism-components/prism-typescript.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
</head>
<body class="bg-[#0A0A0B] text-[#EDEDED] min-h-screen flex flex-col antialiased selection:bg-[#3B82F6]/20 selection:text-[#EDEDED]">

  <!-- Ultra-subtle background grid (<3% opacity) -->
  <div class="fixed inset-0 pointer-events-none subtle-grid-bg z-0 opacity-40"></div>

  <!-- Top Reading Progress Indicator -->
  <div id="reading-progress-container" class="fixed top-0 left-0 w-full h-[2px] bg-transparent z-50 hidden">
    <div id="reading-progress-bar" class="h-full bg-[#3B82F6] w-0 transition-all duration-75"></div>
  </div>

  <!-- 1. Fixed Header (56px, blur(12px), max-w 720px aligned) -->
  <header class="sticky top-0 z-40 w-full nav-blur">
    <div class="max-w-[720px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      
      <!-- Logo: Monospace, font-weight 600 -->
      <a href="#/" class="flex items-center gap-2 group text-[#EDEDED] font-mono text-[14px] font-semibold tracking-tight">
        <span class="text-[#3B82F6] font-mono">/</span>
        <span>aurora.notes</span>
      </a>

      <!-- Desktop Nav: Home / Columns / Archive / Tags / About -->
      <nav class="hidden sm:flex items-center gap-5 md:gap-6 text-[14px]">
        <a href="#/" data-nav-link="home" class="nav-link active">Home</a>
        <a href="#/columns" data-nav-link="columns" class="nav-link">Columns</a>
        <a href="#/archives" data-nav-link="archives" class="nav-link">Archive</a>
        <a href="#/categories" data-nav-link="categories" class="nav-link">Tags</a>
        <a href="#/about" data-nav-link="about" class="nav-link">About</a>
      </nav>

      <!-- Quick Actions (Search Cmd+K) -->
      <div class="flex items-center gap-3">
        <button type="button" onclick="window.BlogApp.openSearchModal()" class="flex items-center gap-2 px-2.5 py-1 rounded-[6px] bg-[#111113] hover:bg-white/[0.04] text-[#8B8B8E] hover:text-[#EDEDED] text-[12px] border border-white/[0.08] transition-all" title="Search articles">
          <svg class="w-3.5 h-3.5 text-[#8B8B8E]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span class="hidden sm:inline font-mono">Search</span>
          <kbd class="hidden sm:inline-block px-1 py-0.2 text-[10px] font-mono bg-[#161618] border border-white/[0.08] rounded text-[#5A5A5E]">⌘K</kbd>
        </button>

        <a href="#/editor" class="text-[12px] font-mono text-[#8B8B8E] hover:text-[#3B82F6] transition-colors hidden sm:inline" title="Write article">Write</a>

        <!-- Mobile menu hamburger -->
        <button type="button" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')" class="sm:hidden p-1.5 rounded-md text-[#8B8B8E] hover:text-[#EDEDED] hover:bg-white/[0.06]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" class="hidden sm:hidden px-4 py-3 space-y-2 border-t border-white/[0.06] bg-[#0A0A0B]/95 backdrop-blur-md max-w-[720px] mx-auto">
      <a href="#/" onclick="document.getElementById('mobile-drawer').classList.add('hidden')" class="block py-1 text-[14px] text-[#EDEDED] font-medium">Home</a>
      <a href="#/columns" onclick="document.getElementById('mobile-drawer').classList.add('hidden')" class="block py-1 text-[14px] text-[#8B8B8E] hover:text-[#EDEDED]">Columns</a>
      <a href="#/archives" onclick="document.getElementById('mobile-drawer').classList.add('hidden')" class="block py-1 text-[14px] text-[#8B8B8E] hover:text-[#EDEDED]">Archive</a>
      <a href="#/categories" onclick="document.getElementById('mobile-drawer').classList.add('hidden')" class="block py-1 text-[14px] text-[#8B8B8E] hover:text-[#EDEDED]">Tags</a>
      <a href="#/about" onclick="document.getElementById('mobile-drawer').classList.add('hidden')" class="block py-1 text-[14px] text-[#8B8B8E] hover:text-[#EDEDED]">About</a>
      <a href="#/editor" onclick="document.getElementById('mobile-drawer').classList.add('hidden')" class="block py-1 text-[14px] text-[#3B82F6] font-mono">Write Article</a>
    </div>
  </header>

  <!-- 2. Main Content Container (Max width 720px, Centered, Ample breathing room) -->
  <main id="app-main" class="flex-grow max-w-[1040px] mx-auto w-full px-4 sm:px-6 relative z-10">
    <!-- Views injected by BlogApp -->
  </main>

  <!-- 3. Minimalist Footer (Clean & quiet, contact info only in About) -->
  <footer class="mt-24 border-t border-white/[0.06] py-10 relative z-10">
    <div class="max-w-[720px] mx-auto px-4 sm:px-6 flex items-center justify-between text-[12px] text-[#5A5A5E] font-mono">
      <div id="footer-copyright">
        © 2026 Alex Chen · All rights reserved.
      </div>
    </div>
  </footer>

  <!-- Search Modal (Cmd+K) -->
  <div id="search-modal" class="fixed inset-0 z-50 flex items-start justify-center pt-24 px-4 bg-black/70 backdrop-blur-sm hidden" onclick="if(event.target === this) window.BlogApp.closeSearchModal()">
    <div class="w-full max-w-[560px] bg-[#111113] rounded-xl border border-white/[0.12] shadow-2xl overflow-hidden">
      <div class="p-3.5 border-b border-white/[0.06] flex items-center gap-3">
        <svg class="w-4 h-4 text-[#8B8B8E]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="search-modal-input" type="text" oninput="window.BlogApp.runModalSearch(this.value)" placeholder="Search articles, tags, concepts..." class="w-full text-[14px] bg-transparent focus:outline-none text-[#EDEDED] placeholder-[#5A5A5E]">
        <button onclick="window.BlogApp.closeSearchModal()" class="text-[11px] font-mono text-[#5A5A5E] hover:text-[#EDEDED] px-1.5 py-0.5 rounded bg-white/[0.04]">ESC</button>
      </div>
      <div id="search-modal-results" class="max-h-80 overflow-y-auto p-2 space-y-1">
        <!-- Results -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Scripts -->
  <script src="js/icons.js"></script>
  <script src="blog.config.js"></script>
  <script src="js/posts-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
  <script>
    function startApp() {
      if (window.BlogApp && typeof window.BlogApp.init === 'function') {
        window.BlogApp.init();
      } else {
        setTimeout(startApp, 40);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
