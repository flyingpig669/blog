<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCC de Notes</title>
  <meta name="description" content="A personal technical blog by CCC, covering topics in Physics, Math, and Computer Science. Explore articles, tutorials, and insights on cutting-edge technologies and research.">
  <!--
    分享 / SEO 元信息。本站为 Hash 路由 SPA（每条路由共享同一个物理 URL），
    因此 canonical 与 og:url 一律指向站点根；配置了 src/config/blog.config.js 的 site.url 后，
       静态值由构建期校验与 src/config/blog.config.js 保持一致。

    两条约定：
    1) 下面三处 description 必须与 src/config/blog.config.js 的 site.description 逐字一致。
       构建期校验静态元信息与配置值，避免爬虫与读者看到不同内容。
    2) lang 声明的是「页面主要语言」。本页外壳 —— 导航、标题、页脚、加载与错误态 ——
       全部是英文，因此声明 en；中文正文属于文章内容，不改变外壳的语言。
       若希望整站按中文声明，改这一处即可（并把上面的 description 换成中文）。
  -->
  <link rel="canonical" id="canonical-link" href="https://notes.theccyy.com/">
  <meta name="theme-color" content="#0A0A0B">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CCC de Notes">
  <meta property="og:title" content="CCC de Notes">
  <meta property="og:description" content="A personal technical blog by CCC, covering topics in Physics, Math, and Computer Science. Explore articles, tutorials, and insights on cutting-edge technologies and research.">
  <meta property="og:url" content="https://notes.theccyy.com/">
  <!--
    og:image 由 `npm run build:og` 生成（scripts/generate-og-image.js，文案取自 src/config/blog.config.js）。
    og:image / og:url / canonical 在静态 HTML 里就必须是绝对地址：
    微信 / Telegram / X 等社交爬虫不执行 JS，看不到 Vue 应用的运行时改写，
    相对路径会直接丢分享卡片（OG 规范也要求绝对 URL）。
    这几处取值来自 src/config/blog.config.js 的 site.url，scripts/validate-content.js 会构建期互查，
    换域名时只改 site.url，再按报错提示同步这里。
  -->
  <meta property="og:image" content="https://notes.theccyy.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="CCC de Notes">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CCC de Notes">
  <meta name="twitter:description" content="A personal technical blog by CCC, covering topics in Physics, Math, and Computer Science. Explore articles, tutorials, and insights on cutting-edge technologies and research.">
  <meta name="twitter:image" content="https://notes.theccyy.com/og-image.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0B'/%3E%3Cpath d='M39 10 22 54' stroke='%233B82F6' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">

  <!--
    反白屏 (anti-FOUC)：外部 CSS 到达前先铺好底色。
    本站为固定深色主题，若不提前上色，浏览器默认白底会闪一下再变黑。
  -->
  <style>
    html, body { margin: 0; background: #0A0A0B; color: #EDEDED; }
  </style>

  <!-- KaTeX 样式与脚本改为按正文需要动态注入（见 src/lib/katex-loader.js）：
       全站只有少数文章用到公式，列表页与无公式文章不再下载这 75KB。 -->

  <!-- Static utilities compiled at build time (no browser Tailwind runtime). -->
  <link rel="stylesheet" href="css/utilities.css">

  <!-- Custom Linear/Vercel Dark CSS -->
  <link rel="alternate" type="application/rss+xml" title="CCC de Notes RSS" href="feed.xml">
  <link rel="stylesheet" href="css/main.css">

  <!-- Vendor JS -->
  <script defer src="vendor/marked.min.js"></script>
  <script defer src="vendor/prism.js"></script>
  <script defer src="vendor/prism-components/prism-javascript.min.js"></script>
  <script defer src="vendor/prism-components/prism-python.min.js"></script>
  <script defer src="vendor/prism-components/prism-bash.min.js"></script>
  <script defer src="vendor/prism-components/prism-typescript.min.js"></script>
  <script defer src="vendor/prism-components/prism-yaml.min.js"></script>
  <script defer src="vendor/prism-components/prism-bibtex.min.js"></script>
  <script defer src="vendor/prism-components/prism-markdown.min.js"></script>
</head>
<body class="bg-page text-primary min-h-screen antialiased selection:bg-accent/20 selection:text-primary">
  <div id="app" class="min-h-screen flex flex-col">
    <main class="shell mx-auto px-4 sm:px-6 pt-16 pb-20" role="status">Loading CCC de Notes…</main>
    <noscript><p class="text-center">Please enable JavaScript to read CCC de Notes.</p><footer class="mt-24 py-10 text-center font-mono text-muted text-[12px]">© 2026 CCC · All rights reserved. · <a href="mailto:ccc0000006@gmail.com">EMAIL</a></footer></noscript>
  </div>
  <script type="module" src="js/vue/app.js"></script>
</body>
</html>
