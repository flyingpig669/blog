# Deploy static content to GitHub Pages
#
# 关键约束：**只发布站点运行时真正需要的文件**。
# 站点运行时只读这些路径（见 js/store.js 的 fetch 与 index.html 的 script/link）：
#   index.html, blog.config.js, css/, js/, data/, vendor/, attachments/
# 外加 robots.txt / sitemap.xml / og-image.png / 404.html。
#
# 历史问题：这里曾直接以 `path: '.'` 发布整个仓库，导致 /AGENTS.md、/deploy.sh、
# /server.py、/sync_posts.py、/tests/*、/templates/* 以及 /posts/*.md 原始 Markdown
# 正文全部可被公开下载（多出约 336K）；且 robots.txt 为 Allow: /，原始 .md 会被
# 搜索引擎当作独立页面索引。现改为先组装 _site/ 白名单目录，再上传。
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install build dependencies
        run: npm ci && python3 -m pip install -r requirements.txt

      - name: Validate, build and test
        run: ./check.sh

      # 组装站点根目录：白名单之外的任何文件都不会进入发布产物。
      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          for f in index.html blog.config.js robots.txt 404.html og-image.png; do
            if [ -f "$f" ]; then cp "$f" _site/; else echo "::warning::缺少站点文件 $f"; fi
          done
          if [ -f sitemap.xml ]; then cp sitemap.xml _site/; fi
          for d in css js data vendor attachments; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
          # 404.html 会被 Pages 原样返回给任意深度的未知物理路径，且 URL 不重写，
          # 因此页内相对路径一律不可用。站点根按 Pages 的规则推导后注入：
          # 项目站点是 /<repo>/，用户站点（仓库名 = <owner>.github.io）是 /。
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${owner}.github.io" ]; then base="/"; else base="/${repo}/"; fi
          if [ -f _site/404.html ]; then
            sed -i "s|__SITE_BASE__|${base}|g" _site/404.html
            if grep -q '__SITE_BASE__' _site/404.html; then
              echo "::error::404.html 中的 __SITE_BASE__ 未被替换"
              exit 1
            fi
            echo "404.html 站点根已注入：${base}"
          else
            echo "::warning::缺少 404.html，非 Hash 路径会落到 Pages 默认 404"
          fi
          # 兜底断言：发布产物里绝不能出现源码、测试、模板或原始 Markdown
          leaked="$(find _site \( -name '*.md' -o -name '*.py' -o -name '*.sh' \
            -o -name 'package*.json' -o -name '*.test.js' -o -name '*.yml' \) -print)"
          if [ -n "$leaked" ]; then
            echo "::error::发布产物中混入源码或文档文件"
            echo "$leaked"
            exit 1
          fi
          echo "发布产物："; du -sh _site; ls -1 _site

      - name: Upload checked build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: checked-site
          path: _site

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download checked build
        uses: actions/download-artifact@v4
        with:
          name: checked-site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 此时工作区只含上一步下载的站点文件，path: '.' 即等于站点根目录。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

