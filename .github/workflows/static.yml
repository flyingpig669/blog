# Deploy static content to GitHub Pages
#
# 关键约束：**只发布站点运行时真正需要的文件**。
# 站点运行时只读这些路径（见 src/lib/store.js 的 fetch 与 index.html 的 script/link）：
#   index.html, css/, js/, data/, vendor/, attachments/
# 外加 robots.txt / sitemap.xml / og-image.png / 404.html。
#
# 历史问题：这里曾直接以 `path: '.'` 发布整个仓库，导致 /AGENTS.md、/deploy.sh、
# /scripts/python/server.py、/scripts/python/sync_posts.py、/tests/*、/templates/* 以及 /posts/*.md 原始 Markdown
# 正文全部可被公开下载（多出约 336K）；且 robots.txt 为 Allow: /，原始 .md 会被
# 搜索引擎当作独立页面索引。现改为先组装 _site/ 白名单目录，再上传。
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install build dependencies
        run: npm ci && python3 -m pip install -r requirements.txt

      - name: Install Office preview converter
        run: |
          if find attachments -type f \( -iname '*.doc' -o -iname '*.docx' -o -iname '*.ppt' -o -iname '*.pptx' \) -print -quit | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress fonts-noto-cjk
          fi

      - name: Validate, build and test
        run: ./check.sh

      # npm run build / check.sh 已使用同一份白名单生成 _site/。
      - name: Verify assembled site
        run: test -f _site/index.html && test -f _site/js/vue/app.js

      - name: Upload checked build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: checked-site
          path: _site

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download checked build
        uses: actions/download-artifact@v4
        with:
          name: checked-site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 此时工作区只含上一步下载的站点文件，path: '.' 即等于站点根目录。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

